name: CI

# public リポジトリなので self-hosted runner は使わない (fork の PR がホストで実行されるのを避ける)。
# 検証は静的検査と、偽 HOME・スタブ・SHM_ROOT を使った隔離テストだけ。実ホストの runner /
# systemd / /dev/shm には触れない。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in *.sh test/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x *.sh test/*.sh
      - name: make help
        run: make help
      - name: test
        run: bash test/run.sh
